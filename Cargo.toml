[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dock-state = { path = "crates/dock-state" }
dock-web = { path = "crates/dock-web" }
util-eval = { path = "crates/util-eval" }

leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
