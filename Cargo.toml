[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dock-state = { path = "crates/dock-state" }
dock-web = { path = "crates/dock-web" }
# The one eval!, kept next door. This becomes
# `{ git = "https://github.com/llGaetanll/eval" }` the day it is published,
# and until then a clone of this repo alone cannot run its tests.
eval = { path = "../eval" }

leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
